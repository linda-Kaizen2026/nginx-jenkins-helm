{{- if and .Values.httpRoute .Values.httpRoute.enabled }}
{{- $fullName := include "nginx-chart.fullname" . }}
{{- $svcPort := .Values.service.port }}

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "nginx-chart.labels" . | nindent 4 }}

spec:
  parentRefs:
    - name: nginx-gateway

  rules:
    - backendRefs:
        - name: {{ $fullName }}
          port: {{ $svcPort }}
          weight: 1

{{- end }}
