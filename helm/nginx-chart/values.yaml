# Namespace (used if your templates reference it)
namespace: nginx-dev

replicaCount: 2

image:
  repository: lindakaizen2026/nginx-app
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 80
  nodePort: 30080

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

serviceAccount:
  create: false

ingress:
  enabled: false

nodeSelector: {}

tolerations: []

affinity: {}
